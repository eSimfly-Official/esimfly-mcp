name: Publish to npm
# Publishes @esimfly/mcp via npm Trusted Publishing (OIDC) — no npm token anywhere.
# Trigger: publish a GitHub Release whose tag matches package.json (e.g. v0.1.1).
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest   # OIDC publishing needs npm >= 11.5
      - run: npm ci
      - name: Check the release tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
