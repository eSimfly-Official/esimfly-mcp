name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # vitest 4 needs Node 20+; the SDK itself supports Node 18 (see node18 job).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  node18:
    # Proves the published bundle runs on the minimum supported runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Smoke-load server module
        run: |
          node --input-type=module -e "import { createEsimflyMcpServer } from './dist/server.js'; if (typeof createEsimflyMcpServer !== 'function') throw new Error('export missing'); console.log('node18 esm ok')"
