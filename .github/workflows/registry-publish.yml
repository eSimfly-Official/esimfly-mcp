name: Publish to MCP Registry
# Publishes server.json to the official MCP Registry using GitHub Actions OIDC —
# no personal token needed; running inside the eSimfly-Official org grants the
# io.github.eSimfly-Official/* namespace. Runs automatically after the npm
# publish workflow succeeds, or manually via "Run workflow".
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  registry:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Wait until npm serves the version in server.json
        run: |
          V=$(node -p "require('./server.json').packages[0].version")
          for i in $(seq 1 20); do npm view "@esimfly/mcp@$V" version >/dev/null 2>&1 && exit 0; sleep 15; done
          echo "npm does not serve @esimfly/mcp@$V yet" >&2; exit 1
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher validate
      - name: Publish (skipped when this version is already in the registry)
        run: |
          NAME=$(node -p "require('./server.json').name")
          V=$(node -p "require('./server.json').version")
          if curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=$(node -p "encodeURIComponent('$NAME'.split('/')[1])")" \
             | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);process.exit((j.servers||[]).some(s=>(s.server||s).name==='$NAME'&&(s.server||s).version==='$V')?0:1)})"; then
            echo "$NAME $V is already published — nothing to do"
          else
            mcp-publisher publish
          fi
